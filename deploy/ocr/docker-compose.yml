services:
  paddleocr:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/tbdavid2019/888-ocr:latest
    container_name: paddleocr-server
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8089:8088"
    environment:
      - PORT=8088
      - OCR_LANG=ch
      - OMP_NUM_THREADS=4
      # - OCR_SECRET_KEY=your_cluster_secret_token
    volumes:
      - ./main.py:/app/main.py
      - ./ocr_markdown.py:/app/ocr_markdown.py
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '6.0'
        reservations:
          memory: 1G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 3s
      retries: 3
