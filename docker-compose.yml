services:
  888-url2md:
    image: ghcr.io/tbdavid2019/888-url2md:latest
    container_name: 888-url2md
    ports:
      # The app listens on h2c at APP_PORT (8080 by default) and HTTP/1.1 at
      # APP_PORT + 1. Nginx on the production host proxies to this port.
      - "${HOST_PORT:-8083}:8081"
    volumes:
      - ./data:/app/data
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      APP_PORT: ${APP_PORT:-8080}
      PORT: ${APP_PORT:-8080}
      # --- SRE Logging & Anti-Abuse Controls (Opt-in) ---
      REQUEST_LOG_ENABLED: ${REQUEST_LOG_ENABLED:-false}
      LOG_DB_PATH: ${LOG_DB_PATH:-/app/data/logs.sqlite}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_MAX_PER_MINUTE: ${RATE_LIMIT_MAX_PER_MINUTE:-60}
      RATE_LIMIT_EXEMPT_IPS: ${RATE_LIMIT_EXEMPT_IPS:-127.0.0.1,::1}
      BLOCKED_IPS: ${BLOCKED_IPS:-}
      BLOCKED_DOMAINS: ${BLOCKED_DOMAINS:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      # --- S3 / Cloudflare R2 Remote Backup (Opt-in) ---
      S3_LOG_BACKUP_ENABLED: ${S3_LOG_BACKUP_ENABLED:-false}
      S3_LOG_BUCKET: ${S3_LOG_BUCKET:-}
      S3_LOG_ENDPOINT: ${S3_LOG_ENDPOINT:-}
      S3_LOG_REGION: ${S3_LOG_REGION:-us-east-1}
      S3_LOG_ACCESS_KEY_ID: ${S3_LOG_ACCESS_KEY_ID:-}
      S3_LOG_SECRET_ACCESS_KEY: ${S3_LOG_SECRET_ACCESS_KEY:-}
      S3_LOG_PREFIX: ${S3_LOG_PREFIX:-url2md-logs/}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    security_opt:
      - seccomp=unconfined
    restart: always

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower-url2md
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
    command: --label-enable

  # Optional local dependency for development. It is excluded from the default
  # production deployment so its ports do not conflict with other services.
  minio:
    profiles: ["dev"]
    image: minio/minio
    hostname: minio
    ports:
      - "9001:9001"
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio-data:/data/minio
    command: server /data/minio --console-address ":9001"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9001/minio/health/live"
        ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      default:
        aliases:
          - minio.dev.jina.ai

volumes:
  minio-data:
